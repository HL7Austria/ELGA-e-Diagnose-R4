Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="11" y="199.625">&#160;</text><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="307" x="11" y="215.7236">Diese kann gerade erst erstellt worden sein oder</text><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="299" x="11" y="231.8223">aus der Gesamtansicht abgerufen worden sein.</text><rect fill="none" height="42.1973" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;" width="499" x="194" y="244.7891"/><path d="M199,244.7891 L259,244.7891 L259,252.7891 L249,262.7891 L194,262.7891 L194,249.7891 A5,5 0 0 1 199,244.7891 " fill="#EEEEEE" style="stroke:#000000;stroke-width:2.0;"/><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="20" x="207" y="259.9209">ref</text><a href="uc_ediag_01_lesen.html#$list-read" target="_top" title="uc_ediag_01_lesen.html#$list-read" xlink:actuate="onRequest" xlink:href="uc_ediag_01_lesen.html#$list-read" xlink:show="new" xlink:title="uc_ediag_01_lesen.html#$list-read" xlink:type="simple"><text fill="#0000EE" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="59" x="414" y="279.9209">$list-read</text></a><path d="M63,301.9863 L63,349.9863 A5,5 0 0 0 68,354.9863 L374,354.9863 A5,5 0 0 0 379,349.9863 L379,306.9863 L369,296.9863 L68,296.9863 A5,5 0 0 0 63,301.9863 " fill="url(#g14gakaohwp2dd0)" style="stroke:#8B95A5;stroke-width:1.0;"/><path d="M369,296.9863 L369,304.4863 A2.5,2.5 0 0 0 371.5,306.9863 L379,306.9863 L369,296.9863 " fill="url(#g14gakaohwp2dd0)" style="stroke:#8B95A5;stroke-width:1.0;"/><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="243" x="69" y="315.1182">GDA erh&#228;lt ein Search-Bundle von der</text><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="295" x="69" y="331.2168">Fachanwendung und bearbeitet die enthaltene</text