" x="11" y="199.625">&#160;</text><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="312" x="11" y="215.7236">Dieser kann gerade erst erstellt worden sein oder</text><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="299" x="11" y="231.8223">aus der Gesamtansicht abgerufen worden sein.</text><rect fill="none" height="42.1973" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;" width="485" x="146" y="244.7891"/><path d="M151,244.7891 L211,244.7891 L211,252.7891 L201,262.7891 L146,262.7891 L146,249.7891 A5,5 0 0 1 151,244.7891 " fill="#EEEEEE" style="stroke:#000000;stroke-width:2.0;"/><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="20" x="159" y="259.9209">ref</text><a href="uc_ediag_01_lesen.html#aktuelle-summary-liste-abrufen" target="_top" title="uc_ediag_01_lesen.html#aktuelle-summary-liste-abrufen" xlink:actuate="onRequest" xlink:href="uc_ediag_01_lesen.html#aktuelle-summary-liste-abrufen" xlink:show="new" xlink:title="uc_ediag_01_lesen.html#aktuelle-summary-liste-abrufen" xlink:type="simple"><text fill="#0000EE" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="201" x="288" y="279.9209">Aktuelle Summary-Liste abrufen</text></a><path d="M15,301.9863 L15,349.9863 A5,5 0 0 0 20,354.9863 L326,354.9863 A5,5 0 0 0 331,349.9863 L331,306.9863 L321,296.9863 L20,296.9863 A5,5 0 0 0 15,301.9863 " fill="url(#g11gz1tnmcvrmn0)" style="stroke:#8B95A5;stroke-width:1.0;"/><path d="M321,296.9863 L321,304.4863 A2.5,2.5 0 0 0 323.5,306.9863 L331,306.9863 L321,296.9863 " fill="url(#g11gz1tnmcvrmn0)" style="stroke:#8B95A5;stroke-width:1.0;"/><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="243" x="21" y="315.1182">GDA erh&#228;lt ein Search-Bundle von der</text><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="295" x="21" y="331.2168">Facha