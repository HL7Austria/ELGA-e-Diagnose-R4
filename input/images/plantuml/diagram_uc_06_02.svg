ne</text><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="99" x="69" y="347.3154">List-Ressource.</text><line style="stroke:#111827;stroke-width:1.0;" x1="226" x2="268" y1="381.231" y2="381.231"/><line style="stroke:#111827;stroke-width:1.0;" x1="268" x2="268" y1="381.231" y2="394.231"/><line style="stroke:#111827;stroke-width:1.0;" x1="227" x2="268" y1="394.231" y2="394.231"/><polygon fill="#111827" points="237,390.231,227,394.231,237,398.231,233,394.231" style="stroke:#111827;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="233" y="376.4761">1</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200" x="244" y="376.4761">Bestehende Ressource ausw&#228;hlen</text><line style="stroke:#111827;stroke-width:1.0;" x1="226" x2="268" y1="453.0771" y2="453.0771"/><line style="stroke:#111827;stroke-width:1.0;" x1="268" x2="268" y1="453.0771" y2="466.0771"/><line style="stroke:#111827;stroke-width:1.0;" x1="227" x2="268" y1="466.0771" y2="466.0771"/><polygon fill="#111827" points="237,462.0771,227,466.0771,237,470.0771,233,466.0771" style="stroke:#111827;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7" x="233" y="433.3735">2</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="120" x="244" y="418.4248">List.entry hinzuf&#252;gen</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="125" x="244" y="433.3735">- List.entry.flag = new</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316" x="244" y="448.3223">- List.entry.item = Referenz auf bestehende Ressource</text><path d="M122,484.0771 L122,532.0771 A5,5 0 0 0 127,537.0771 L314,537.0771 A5,5 0 0 0 319,532.0771 L319,489.0771 L309,479.0771 L1